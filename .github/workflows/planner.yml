name: Planner

on:
  push:
    branches: [main]
    paths: ["web/**", "android/app/src/main/assets/**", "branding/logo.svg", ".github/workflows/planner.yml"]
  pull_request:
    paths: ["web/**"]
  workflow_dispatch:
    inputs:
      deploy:
        description: "Publish the planner website (GitHub Pages)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: node web/test.mjs
      - run: python3 web/build.py
      - uses: actions/upload-artifact@v4
        with:
          name: chompchamp-planner
          path: web/dist/chompchamp-planner.html
          retention-days: 7
      - if: inputs.deploy
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist/site

  # The website only changes when someone asks for it, like a release.
  deploy:
    if: inputs.deploy
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
