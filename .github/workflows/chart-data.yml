name: Build WA chart data

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish as a GitHub Release (otherwise: workflow artifact only)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Install GDAL and build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gdal-bin unzip build-essential libsqlite3-dev zlib1g-dev

      - name: Cache tippecanoe
        id: tc-cache
        uses: actions/cache@v4
        with:
          path: /opt/tippecanoe
          key: tippecanoe-2.53.0-${{ runner.os }}

      - name: Build tippecanoe
        if: steps.tc-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch 2.53.0 https://github.com/felt/tippecanoe.git /tmp/tippecanoe
          make -C /tmp/tippecanoe -j"$(nproc)"
          sudo make -C /tmp/tippecanoe install PREFIX=/opt/tippecanoe

      - run: echo "/opt/tippecanoe/bin" >> "$GITHUB_PATH"

      - name: Cache AusBathyTopo download
        uses: actions/cache@v4
        with:
          path: pipeline/build/ausbathytopo.zip
          key: ausbathytopo-australia-2024-250m

      - name: Python packages for the detailed area
        run: |
          python3 -m venv /tmp/venv
          /tmp/venv/bin/pip install -q -r pipeline/requirements.txt

      - name: Build wa.pmtiles
        env:
          PY: /tmp/venv/bin/python
        run: ./pipeline/build.sh

      # Releases only on explicit request: never published automatically.
      - uses: actions/upload-artifact@v4
        with:
          name: wa
          path: pipeline/out/wa.pmtiles
          retention-days: 7

      - name: Publish release
        if: ${{ inputs.publish }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="chart-wa-$(date -u +%Y%m%d-%H%M)"
          SIZE=$(du -h pipeline/out/wa.pmtiles | cut -f1)
          gh release create "$TAG" pipeline/out/wa.pmtiles \
            --title "WA chart $(date -u +%Y-%m-%d)" \
            --notes "Offline WA chart (${SIZE}). Import in the app via ☰ → Charts & relief data. NOT FOR NAVIGATION." \
            --latest=false
