name: Build WA reef relief pack

on:
  workflow_dispatch:
    inputs:
      maxzoom:
        description: "Max zoom (15 ≈ 4 m/pixel, matches the 5 m source)"
        default: "15"
      publish:
        description: "Publish as a GitHub Release (otherwise: workflow artifact only)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow pmtiles
      - name: Build wa-relief.pmtiles
        run: |
          mkdir -p pipeline/out
          python -I pipeline/scripts/build_relief.py pipeline/out/wa-relief.pmtiles --maxzoom "${{ inputs.maxzoom || 15 }}"
      # Releases only on explicit request: never published automatically.
      - uses: actions/upload-artifact@v4
        with:
          name: wa-relief
          path: pipeline/out/wa-relief.pmtiles
          retention-days: 7

      - name: Publish release
        if: ${{ inputs.publish }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="relief-wa-$(date -u +%Y%m%d-%H%M)"
          SIZE=$(du -h pipeline/out/wa-relief.pmtiles | cut -f1)
          gh release create "$TAG" pipeline/out/wa-relief.pmtiles \
            --title "WA reef relief $(date -u +%Y-%m-%d)" \
            --notes "Offline 5 m bathymetry imagery from WA Department of Transport (${SIZE}), CC BY 3.0 AU. Import in the app via Menu → Import chart file. NOT FOR NAVIGATION." \
            --latest=false
