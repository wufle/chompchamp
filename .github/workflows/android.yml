name: Android build

on:
  push:
    paths: ["android/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4

      # The same key must sign every build, or phones refuse to update the installed app.
      - name: Restore signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::warning::ANDROID_KEYSTORE_B64 secret not set - signing with a temporary key. It installs, but won't update over other builds. See README 'Signing'."
            exit 0
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.p12"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"

      - name: Build release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          ./gradlew --no-daemon assembleRelease
          mkdir -p ../dist
          VERSION=$(grep versionName app/build.gradle.kts | sed 's/.*"\(.*\)".*/\1/')
          SUFFIX=""
          [ -z "${ANDROID_KEYSTORE_PATH:-}" ] && SUFFIX="-tempkey"
          cp app/build/outputs/apk/release/app-release.apk "../dist/chompchamp-$VERSION$SUFFIX.apk"
          ls -la ../dist

      - uses: actions/upload-artifact@v4
        with:
          name: chompchamp-apk
          path: dist/*.apk
          retention-days: 7   # only the latest build is ever needed
